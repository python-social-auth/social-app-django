name: Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false

    - name: Build wheel
      run: uv build --wheel

    - name: Upload wheel
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-wheel
        path: dist/*.whl
        if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false

    - name: Build source distribution
      run: uv build --sdist

    - name: Upload source distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  lint-dist:
    runs-on: ubuntu-latest
    needs:
    - build-wheel
    - build-sdist
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false

    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Rebuild wheel from source distribution
      run: uv build dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/from-sdist"

    - name: Verify distribution file policy
      run: python scripts/check_distribution.py dist "$RUNNER_TEMP/from-sdist"

    - name: Verify wheel install
      run: |
        uv venv .venv-install-whl
        source .venv-install-whl/bin/activate
        uv pip install dist/*.whl

    - name: Verify source install
      run: |
        uv venv .venv-install-tar
        source .venv-install-tar/bin/activate
        uv pip install dist/*.tar.gz

    - name: Check package metadata
      run: uv run --frozen --only-group package-lint twine check dist/*.tar.gz dist/*.whl

    - name: Check distribution contents
      run: uv run --frozen --only-group package-lint pydistcheck --inspect dist/*.tar.gz dist/*.whl

    - name: Check source metadata
      run: uv run --frozen --only-group package-lint pyroma dist/*.tar.gz

    - name: Check wheel contents
      run: uv run --frozen --only-group package-lint check-wheel-contents dist/*.whl

    - name: Check source manifest
      run: uv run --frozen --only-group package-lint check-manifest -v

  publish-pypi:
    runs-on: ubuntu-latest
    needs: lint-dist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'python-social-auth/social-app-django'
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true

  publish-github-release:
    runs-on: ubuntu-latest
    needs: lint-dist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Extract release notes
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        version="${TAG_NAME#v}"
        awk -v version="$version" '
          index($0, "## [" version "]") == 1 { in_section = 1; next }
          in_section && /^## / { exit }
          in_section { print }
        ' CHANGELOG.md > release-notes.md
        sed -i '1{/^$/d;}' release-notes.md
        if ! grep -q '[^[:space:]]' release-notes.md; then
          echo "No CHANGELOG.md section found for ${version}" >&2
          exit 1
        fi

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if gh release view "$TAG_NAME" >/dev/null 2>&1; then
          echo "A release already exists for ${TAG_NAME}; inspect it before retrying." >&2
          exit 1
        fi
        gh release create "$TAG_NAME" --verify-tag --draft --notes-file release-notes.md dist/*.whl dist/*.tar.gz
        gh release edit "$TAG_NAME" --draft=false
