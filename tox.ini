[tox]
envlist =
    py{311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    py{312,313.314}-djangomain
    py{311,312,313,314}-socialmaster

[testenv]
passenv = *
allowlist_externals =
  uv
install_command =
    !socialmaster: uv pip install --no-binary lxml --no-binary xmlsec {opts} {packages}
    socialmaster: uv pip install --no-binary lxml --no-binary xmlsec --overrides {toxinidir}/.github/social-core-master.txt {opts} {packages}
commands =
    coverage run manage.py test
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz
    socialmaster: https://github.com/python-social-auth/social-core/archive/master.tar.gz
    .[dev]
